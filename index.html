
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Resonance AGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;700&display=swap');
        
        :root {
            --cyan-glow: rgba(34, 211, 238, 0.4);
            --magenta-glow: rgba(236, 72, 153, 0.4);
            --indigo-glow: rgba(99, 102, 241, 0.4);
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(16, 185, 129, 0.14), transparent 26%),
                radial-gradient(circle at top right, rgba(34, 211, 238, 0.12), transparent 22%),
                linear-gradient(180deg, #020617 0%, #06101f 42%, #020617 100%);
            color: #e2e8f0;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .resonance-glow {
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(15, 23, 42, 0.78), rgba(2, 6, 23, 0.9));
            backdrop-filter: blur(18px);
            border: 1px solid rgba(148, 163, 184, 0.14);
            box-shadow: 0 20px 45px rgba(2, 6, 23, 0.36);
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.8);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 1);
        }

        /* Prevent grid items from growing beyond their container */
        .min-h-0 {
            min-height: 0;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 15px var(--cyan-glow); }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 25px var(--cyan-glow); }
        }

        .systole-diastole {
            animation: breathe 6s ease-in-out infinite;
        }

        /* URE OpCode Item Hover Effect */
        .opcode-row:hover {
            background: rgba(99, 102, 241, 0.1);
            border-left: 2px solid #6366f1;
        }
        
        /* Grid specifically for Fractal Memory since Tailwind default is 12 */
        .grid-memory {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            grid-template-rows: repeat(16, minmax(0, 1fr));
        }
    </style>
<!-- Module resolution handled by Vite bundler -->
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
